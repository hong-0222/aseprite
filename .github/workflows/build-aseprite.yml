name: Build Aseprite Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V1.3
          submodules: recursive

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build
        shell: bash
        run: bash build.sh --auto --norun

      - name: Copy OpenSSL DLLs
        shell: pwsh
        run: |
          Get-ChildItem -Path "C:\" -Recurse -Filter "libcrypto-3-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 | Copy-Item -Destination build\bin\
          Get-ChildItem -Path "C:\" -Recurse -Filter "libssl-3-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 | Copy-Item -Destination build\bin\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: build/bin
