name: Build Aseprite Windows
on:
  push:
    branches: [ v1.3 ]
  workflow_dispatch:

env:
  SKIA_TAG: m124-0
  SKIA_ZIP: Skia-Windows-x64.zip

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Skia
        run: |
          curl -L -O https://github.com/aseprite/skia/releases/download/${{ env.SKIA_TAG }}/${{ env.SKIA_ZIP }}
          unzip -q ${{ env.SKIA_ZIP }} -d skia

      - name: CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release `
          -DLAF_BACKEND=skia `
          -DSKIA_DIR=${{ github.workspace }}\skia `
          -DSKIA_LIBRARY_DIR=${{ github.workspace }}\skia\out\Release-x64 `
          -DSKIA_LIBRARY=${{ github.workspace }}\skia\out\Release-x64\skia.lib `
          -G Ninja ..

      - name: Ninja build
        run: |
          cd build
          ninja aseprite

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Aseprite
          Copy-Item build\bin\aseprite.exe dist\Aseprite\
          Copy-Item build\bin\icudtl.dat dist\Aseprite\
          Copy-Item build\bin\data dist\Aseprite\data -Recurse
          Compress-Archive -Path dist\Aseprite\* -DestinationPath dist\Aseprite-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-win-x64
          path: dist\Aseprite-win-x64.zip
          retention-days: 14
