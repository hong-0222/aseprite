name: Build Aseprite Windows
on:
  workflow_dispatch:

jobs:
  build_aseprite_win:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [RelWithDebInfo]
        target: [gui]
    steps:
      - name: Checkout Aseprite source
        uses: actions/checkout@v4
        with:
          ref: V1.3
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and Extract Skia
        run: |
          mkdir skia
          cd skia
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip
          tar -xf skia.zip
        shell: pwsh

      - name: CMake Configure
        run: |
          cmake -S . -B build -G Ninja -DLAF_BACKEND=skia "-DSKIA_DIR=$PWD/skia" "-DSKIA_LIBRARY_DIR=$PWD/skia/out/Release-x64" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        shell: pwsh

      - name: Build
        run: cmake --build build --target ${{ matrix.target }}
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: build/bin
