name: Build Aseprite v1.3 Windows
on:
  push:
    branches: [ v1.3 ]
  workflow_dispatch:

env:
  SKIA_TAG: m124-08a5439a6b
  SKIA_ZIP: Skia-Windows-Release-x64.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite v1.3
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: v1.3

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: 加载 MSVC 2022 x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 下载对应版本 Skia
        run: |
          curl -L -O https://github.com/aseprite/skia/releases/download/${{ env.SKIA_TAG }}/${{ env.SKIA_ZIP }}
          unzip -q ${{ env.SKIA_ZIP }} -d skia

      - name: CMake 配置
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release `
          -DLAF_BACKEND=skia `
          -DSKIA_DIR=${{ github.workspace }}\skia `
          -DSKIA_LIBRARY_DIR=${{ github.workspace }}\skia\out\Release-x64 `
          -DSKIA_LIBRARY=${{ github.workspace }}\skia\out\Release-x64\skia.lib `
          -G Ninja ..

      - name: Ninja 编译
        run: |
          cd build
          ninja aseprite

      - name: 打包成zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Aseprite
          Copy-Item build\bin\aseprite.exe dist\Aseprite\
          Copy-Item build\bin\icudtl.dat dist\Aseprite\
          Copy-Item build\bin\data dist\Aseprite\data -Recurse
          Compress-Archive -Path dist\Aseprite\* -DestinationPath dist\Aseprite-win-x64.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-win-x64
          path: dist\Aseprite-win-x64.zip
          retention-days: 14
